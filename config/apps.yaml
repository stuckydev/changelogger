# App configuration — add new apps here.
# parser: rss | todoist_html | notion_html | github_releases | cursor_html | zendesk_articles | steam_news | actual_blog | mtgarena_notes
# steam_news: source_url must contain a Steam app id (/app/669330 or appid=669330)
# github_releases / actual_blog: set github_repo (releases page URL is derived automatically)
# highlight_limit / highlight_terms: optional display policy
# logo_url: optional, defaults to /static/logos/{slug}.{png,ico,...}
# category: saas | selfhosted | games | utilities

apps:
  - slug: todoist
    name: Todoist
    category: saas
    source_url: https://www.todoist.com/help/articles/2026-changelog-HD3jJAtLd
    parser: todoist_html

  - slug: 1password
    name: 1Password
    subtitle: Windows
    category: saas
    source_url: https://releases.1password.com/windows/stable/index.xml
    parser: rss

  - slug: cursor
    name: Cursor
    category: saas
    source_url: https://cursor.com/changelog
    parser: cursor_html

  - slug: actual
    name: Actual Budget
    category: selfhosted
    github_repo: actualbudget/actual
    parser: actual_blog

  - slug: mtgarena
    name: MTG Arena
    subtitle: Client
    category: games
    source_url: https://mtgarena-support.wizards.com/api/v2/help_center/en-us/sections/4402585813268/articles.json?per_page=5&sort_by=created_at&sort_order=desc
    parser: mtgarena_notes
    highlight_limit: 18
    highlight_terms:
      - Challenge
      - Friends
      - Draft
      - Sealed
      - Limited

  - slug: naowhforever
    name: Naowh Forever
    subtitle: UI
    category: games
    github_repo: naowh-gaming/NaowhForever
    parser: github_releases

  - slug: winutil
    name: WinUtil
    subtitle: Chris Titus Tech
    category: utilities
    github_repo: ChrisTitusTech/winutil
    parser: github_releases

  - slug: powertoys
    name: PowerToys
    category: utilities
    github_repo: microsoft/PowerToys
    parser: github_releases

  - slug: jetkvm
    name: JetKVM
    category: utilities
    github_repo: jetkvm/kvm
    parser: github_releases
