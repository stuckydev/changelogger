{% macro brand_mark(gid) %}
<svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
  <defs>
    <linearGradient id="{{ gid }}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#{{ gid }})" opacity="0.14"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#{{ gid }})" stroke-width="3" opacity="0.45"/>
  <rect x="15" y="17" width="22" height="6" rx="3" fill="url(#{{ gid }})"/>
  <circle cx="45.5" cy="20" r="4.5" fill="url(#{{ gid }})"/>
  <rect x="15" y="29" width="34" height="6" rx="3" fill="url(#{{ gid }})" opacity="0.62"/>
  <rect x="15" y="41" width="27" height="6" rx="3" fill="url(#{{ gid }})" opacity="0.38"/>
</svg>
{% endmacro %}
